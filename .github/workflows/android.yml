name: Crear APK de PULSO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar proyecto Flutter
        working-directory: pulso_mvp_flutter-1
        run: flutter create --platforms=android --org com.pulso.app .

      - name: Descargar dependencias
        working-directory: pulso_mvp_flutter-1
        run: flutter pub get

      - name: Crear APK
        working-directory: pulso_mvp_flutter-1
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-APK
          path: pulso_mvp_flutter-1/build/app/outputs/flutter-apk/app-release.apk
